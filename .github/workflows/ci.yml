name: CI

on:
  pull_request:
  push:
    branches: [main]
  # A release pull request is opened with the built-in GITHUB_TOKEN. Runs for it
  # ARE created, but held in GitHub's `action_required` state until a maintainer
  # approves them from the pull request's own Checks section. Worth knowing:
  # `gh pr checks` reports nothing at all while a run is held, which reads
  # exactly like "no checks were ever created" — it is not the same thing.
  #
  # This trigger is the manual fallback for reporting checks against a branch
  # when approving the held run is not an option.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify the published file list
        run: npm pack --dry-run

  # Reported, not enforced: a number that gates merges gets gamed, and this one
  # is here to show what a change did to the suite.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  # Node 20 is missing here on purpose, and its absence is covered by the
  # `smoke` job below. jsdom 30 fails to start on it --
  # `webidl.util.markAsUncloneable is not a function` -- which is a limit of the
  # test environment, not of this package. Dropping Node 20 from `engines` to
  # match the test runner would be the tail wagging the dog: nothing shipped
  # here is newer than ES2022.
  test-node:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  # Aggregates the matrix into a single stable check name, so branch protection
  # does not have to be re-pointed every time the Node version list changes.
  test:
    name: test
    runs-on: ubuntu-latest
    needs: test-node
    if: always()
    steps:
      - name: Fail if any matrix job did not succeed
        run: |
          if [ "${{ needs.test-node.result }}" != "success" ]; then
            echo "test matrix result: ${{ needs.test-node.result }}"
            exit 1
          fi
          echo "test matrix passed on all Node versions"

  # What Node actually has to do with this package: load it. Runs on the oldest
  # supported version, with no jsdom involved, so the `engines` floor is a
  # tested claim rather than an assumption.
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Import the built package on the oldest supported Node
        run: |
          node --input-type=module -e "
            import { moveItem } from './dist/array.js';
            const moved = moveItem(['a', 'b', 'c'], 0, 2);
            if (moved.join('') !== 'bca') throw new Error('ESM subpath: got ' + moved.join(''));
            console.log('esm  ./array  ok');
          "
          node --input-type=commonjs -e "
            const { moveItem } = require('./dist/array.cjs');
            const moved = moveItem(['a', 'b', 'c'], 0, 2);
            if (moved.join('') !== 'bca') throw new Error('CJS subpath: got ' + moved.join(''));
            console.log('cjs  ./array  ok');
          "
          node --input-type=module -e "
            import * as api from './dist/index.js';
            if (typeof api.DragDropProvider !== 'function') throw new Error('ESM root: DragDropProvider missing');
            if (typeof api.useSortableList !== 'function') throw new Error('ESM root: useSortableList missing');
            console.log('esm  .       ok');
          "
          node --input-type=commonjs -e "
            const api = require('./dist/index.cjs');
            if (typeof api.DragDropProvider !== 'function') throw new Error('CJS root: DragDropProvider missing');
            console.log('cjs  .       ok');
          "
